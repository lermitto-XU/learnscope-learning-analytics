services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: learnscope
      MYSQL_USER: learnscope
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Generate .env with scripts/create_env.py}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate .env with scripts/create_env.py}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u learnscope -D learnscope -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  predictor:
    build: ./predictor
    environment:
      PREDICTOR_KEY: ${PREDICTOR_KEY:?Generate .env with scripts/create_env.py}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  server:
    build: ./server
    environment:
      BIND_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/learnscope?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: learnscope
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_SCHEMA: classpath:schema.sql
      PREDICTOR_URL: http://predictor:8001
      PREDICTOR_KEY: ${PREDICTOR_KEY}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8090}
      DEMO_MODE: ${DEMO_MODE:-true}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      mysql: { condition: service_healthy }
      predictor: { condition: service_healthy }
    restart: unless-stopped
  web:
    build: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    depends_on:
      - server
    restart: unless-stopped
volumes:
  mysql-data:
