server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/learnscope;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=${DB_SCHEMA:classpath:schema.sql,classpath:indexes-h2.sql}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.hikari.maximum-pool-size=10
app.predictor-url=${PREDICTOR_URL:http://127.0.0.1:8001}
app.origin=${APP_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
app.secure-cookie=${SECURE_COOKIE:false}
app.demo=${DEMO_MODE:true}
app.demo-password=${DEMO_PASSWORD:LearnScope2026!}
